name: Xcode remote cache build and test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  xcode_path: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  remote-cache-build-test:
    name: Build and test with xcode remote cache
    runs-on: macos-15
    env:
      FIREFOX_SCHEME: Fennec
      FIREFOX_CONFIGURATION: Fennec_Testing
      FIREFOX_TEST_PLAN: UnitTest
      FIREFOX_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=26.2
      FIREFOX_BUILD_TASK: build-for-testing

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Check out source code
        uses: actions/checkout@v4.1.7

      - name: Select required Xcode version
        run: |
          sudo xcode-select -s "${{ env.xcode_path }}"
          xcodebuild -version

      - name: Disable Swift macro validation
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipMacroFingerprintValidation -bool YES

      - name: Setup Firefox build environment
        run: |
          ./bootstrap.sh focus
          ./bootstrap.sh firefox --force

      - name: Install xcodecacheprog
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Build tests with remote cache
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/run-remote-cached-firefox-build.sh

      - name: Test without building
        run: exec ./.github/scripts/run-firefox-test-without-building.sh
