name: Xcode cache build and test

on:
  workflow_dispatch:

env:
  xcode_path: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  cas-cache-test:
    name: Xcode cache build and test
    runs-on: macos-15
    env:
      FIREFOX_SCHEME: Fennec
      FIREFOX_CONFIGURATION: Fennec_Testing
      FIREFOX_TEST_PLAN: UnitTest
      FIREFOX_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=26.2
      FIREFOX_BUILD_TASK: build-for-testing

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Check out source code
        uses: actions/checkout@v4.1.7

      - name: Select required Xcode version
        run: |
          sudo xcode-select -s "${{ env.xcode_path }}"
          xcodebuild -version

      - name: Disable Swift macro validation
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipMacroFingerprintValidation -bool YES

      - name: Setup Firefox build environment
        run: |
          ./bootstrap.sh focus
          ./bootstrap.sh firefox --force

      - name: Install xcodecacheprog
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Remove build state
        run: |
          rm -rf "${HOME}/DerivedData"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"
          test ! -e "${HOME}/DerivedData"

      - name: build-for-testing without cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/run-firefox-build-for-testing.sh

      - name: Remove build state
        run: |
          rm -rf "${HOME}/DerivedData"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"
          test ! -e "${HOME}/DerivedData"

      - name: build-for-testing without cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/run-firefox-build-for-testing.sh

      - name: test-without-building without cache
        run: exec ./.github/scripts/run-firefox-test-without-building.sh

      - name: Remove build state
        run: |
          rm -rf "${HOME}/DerivedData"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"
          test ! -e "${HOME}/DerivedData"

      - name: build-for-testing with remote cache
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/run-remote-cached-firefox-build.sh

      - name: "`xcodebuildprog test` with remote cache"
        run: |
          DERIVED_DATA_PATH="${HOME}/DerivedData"
          PRODUCTS_DIR="${DERIVED_DATA_PATH}/Build/Products"
          XCTESTRUN_PATH="$(
            find "${PRODUCTS_DIR}" \
              -type f \
              -name "${FIREFOX_SCHEME}_${FIREFOX_TEST_PLAN}_*.xctestrun" \
              -print \
              -quit
          )"

          if [[ -z "${XCTESTRUN_PATH}" ]]; then
            echo "No ${FIREFOX_SCHEME}_${FIREFOX_TEST_PLAN}_*.xctestrun file found under ${PRODUCTS_DIR}" >&2
            echo "Available .xctestrun files:" >&2
            find "${PRODUCTS_DIR}" -type f -name '*.xctestrun' -print >&2 || true
            exit 1
          fi

          XCTESTRUN_PATH="$(cd "$(dirname "${XCTESTRUN_PATH}")" && pwd)/$(basename "${XCTESTRUN_PATH}")"

          cd firefox-ios

          xcodecacheprog test \
            --xctestrun "${XCTESTRUN_PATH}" \
            --destination "${FIREFOX_TEST_DESTINATION}" \
            --ignore-non-cacheable
