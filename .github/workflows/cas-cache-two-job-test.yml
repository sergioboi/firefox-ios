name: CAS cache test

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Cache mode to test
        type: choice
        required: true
        default: local
        options:
          - local
          - remote
      clear_local_cache_dir:
        description: Clear .ci/cas-build-cache before cold local-cache builds
        type: boolean
        required: true
        default: true

env:
  xcode_path: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  cas-cache-test:
    name: CAS cache build tests and verify
    runs-on: macos-15
    env:
      CACHE_MODE: ${{ inputs.cache_mode }}
      CLEAR_LOCAL_CACHE_DIR: ${{ inputs.clear_local_cache_dir }}
      FIREFOX_SCHEME: Fennec
      FIREFOX_CONFIGURATION: Fennec_Testing
      FIREFOX_TEST_PLAN: UnitTest
      FIREFOX_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=26.2

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Check out source code
        uses: actions/checkout@v4.1.7

      - name: Set Firefox DerivedData path
        run: echo "FIREFOX_DERIVED_DATA_PATH=${RUNNER_TEMP}/firefox-derived-data" >> "${GITHUB_ENV}"

      - name: Select required Xcode version
        run: |
          sudo xcode-select -s "${{ env.xcode_path }}"
          xcodebuild -version

      - name: Disable Swift macro validation
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipMacroFingerprintValidation -bool YES

      - name: Setup Firefox build environment
        run: |
          ./bootstrap.sh focus
          ./bootstrap.sh firefox --force

      - name: Install CASBuildCache
        if: ${{ inputs.cache_mode == 'local' }}
        run: exec ./.github/scripts/install-cas-build-cache.sh

      - name: Install xcodecacheprog
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Build tests without cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/run-firefox-build-for-testing.sh

      - name: Clean before second no-cache build
        run: |
          xcodebuild clean \
            -project firefox-ios/Client.xcodeproj \
            -scheme "${FIREFOX_SCHEME}" \
            -destination "${FIREFOX_TEST_DESTINATION}" \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          rm -rf "${FIREFOX_DERIVED_DATA_PATH}"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Build tests without cache after clean
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/run-firefox-build-for-testing.sh

      - name: Test second no-cache build
        run: exec ./.github/scripts/run-firefox-test-without-building.sh

      - name: Ensure cached build starts without local CAS data when requested
        run: |
          if [[ "${CACHE_MODE}" == "local" && "${CLEAR_LOCAL_CACHE_DIR}" == "true" ]]; then
            rm -rf .ci/cas-build-cache
          else
            echo "Skipping local CAS cache directory cleanup"
          fi

      - name: Clean before cached build
        run: |
          xcodebuild clean \
            -project firefox-ios/Client.xcodeproj \
            -scheme "${FIREFOX_SCHEME}" \
            -destination "${FIREFOX_TEST_DESTINATION}" \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          rm -rf "${FIREFOX_DERIVED_DATA_PATH}"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Build tests with cache enabled
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: |
          if [[ "${CACHE_MODE}" == "remote" ]]; then
            exec ./.github/scripts/run-remote-cached-firefox-build.sh
          else
            exec ./.github/scripts/run-cas-cached-firefox-build.sh
          fi

      - name: Show warmed cache
        if: ${{ inputs.cache_mode == 'local' }}
        run: |
          du -sh .ci/cas-build-cache
          find .ci/cas-build-cache -maxdepth 2 -type f | head -n 30

      - name: Test cached build
        run: |
          PRODUCTS_DIR="${FIREFOX_DERIVED_DATA_PATH}/Build/Products"
          XCTESTRUN_PATH="$(
            find "${PRODUCTS_DIR}" \
              -type f \
              -name "${FIREFOX_SCHEME}_${FIREFOX_TEST_PLAN}_*.xctestrun" \
              -print \
              -quit
          )"

          if [[ -z "${XCTESTRUN_PATH}" ]]; then
            echo "No ${FIREFOX_SCHEME}_${FIREFOX_TEST_PLAN}_*.xctestrun file found under ${PRODUCTS_DIR}" >&2
            echo "Available .xctestrun files:" >&2
            find "${PRODUCTS_DIR}" -type f -name '*.xctestrun' -print >&2 || true
            exit 1
          fi

          XCTESTRUN_PATH="$(cd "$(dirname "${XCTESTRUN_PATH}")" && pwd)/$(basename "${XCTESTRUN_PATH}")"

          cd firefox-ios

          xcodecacheprog test \
            --xctestrun "${XCTESTRUN_PATH}" \
            --destination "${FIREFOX_TEST_DESTINATION}" \
            --ignore-non-cacheable